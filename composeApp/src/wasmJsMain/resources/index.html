<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- SEO & Meta Tags -->
    <title>LibretApp - Gestión Escolar Inteligente</title>
    <meta name="description" content="Plataforma de comunicación y asistencia para profesores y apoderados. Gestiona tus cursos de forma independiente y profesional.">
    <meta name="theme-color" content="#1976D2">
    
    <!-- OpenGraph (Redes Sociales) -->
    <meta property="og:title" content="LibretApp">
    <meta property="og:description" content="Tu libreta de comunicaciones ahora en la nube.">
    <meta property="og:type" content="website">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --bg-color: #ffffff;
            --text-color: #1f2937;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-color: #f8fafc;
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            margin-bottom: 24px;
            animation: pulse 2s infinite ease-in-out;
        }

        .logo-text {
            color: white;
            font-size: 60px;
            font-weight: bold;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        .loading-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(156, 163, 175, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-bar-progress {
            width: 40%;
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 2px;
            animation: progressMove 1.5s infinite ease-in-out;
        }

        .status-text {
            margin-top: 16px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes progressMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="logo-container">
            <span class="logo-text">L</span>
        </div>
        <div class="loading-bar-container">
            <div class="loading-bar-progress"></div>
        </div>
        <p class="status-text">Iniciando Experiencia...</p>
    </div>

    <div id="app-root"></div>

    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>

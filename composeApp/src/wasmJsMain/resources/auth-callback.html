<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibretApp - Autenticando...</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; font-family: sans-serif; background: #ffffff;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid #e0e0e0;
            border-top-color: #1976D2; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Sincronizando sesión...</p>
    <script>
        // Muy importante: Al usar PKCE o Implicit Flow, los datos (code o access_token)
        // vienen en la URL. Debemos pasarlos a la página principal para que la SDK los procese.
        const currentUrl = new URL(window.location.href);
        const targetUrl = new URL('/', window.location.origin);

        // Preservar tanto el hash (#) como los parámetros de búsqueda (?)
        targetUrl.search = currentUrl.search;
        targetUrl.hash = currentUrl.hash;

        console.log("Redirigiendo a:", targetUrl.toString());
        window.location.href = targetUrl.toString();
    </script>
</body>
</html>

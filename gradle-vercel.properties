# ============================================================
# FASE 6 — Gradle properties específicas para builds en Vercel.
# Aplicar desde build-vercel.sh:
#   ./gradlew ... -Dorg.gradle.project.gradleUserHome=/tmp/gradle \
#                  --project-prop org.gradle.daemon=false
# o copiar este archivo sobre gradle.properties solo en el step de CI:
#   cp gradle-vercel.properties gradle.properties
#
# Mantiene gradle.properties como configuración para desarrollo local
# (daemon ON, parallel ON, incremental ON) → builds rápidas en dev.
# ============================================================

org.gradle.java.home.auto-provisioning=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
org.gradle.warning.mode=none

kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx2g

android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.native.ignoreDisabledTargets=true
